<style>

:root{--bg:#120708;--panel:#1d0c0e;--card2:#241012;--line:#3d1c20;--text:#f6ead8;--muted:#b89c8e;--bulb:#ffcf3f;--velvet:#a81e28;--yes:#ffcf3f;--no:#e5484f;

function statBlock(arr){if(!arr.length)return '<p class="empty sm">Aucun film vu pour l’instant. Quand tu confirmes un film dans « Mes films », il apparaît ici.</p>';

function watchUrl(n,f,o){const q=encodeURIComponent(o.ti||f.t);if(/netflix/i.test(n))return 'https://www.netflix.com/search?q='+q;if(/prime video|amazon/i.test(n))return 'https://www.primevideo.com/search?phrase='+q;if(o.id)return `https://www.themoviedb.org/${o.ty||'movie'}/${o.id}/watch?locale=FR`;return 'https://www.justwatch.com/fr/recherche?q='+q}

/* ================= TRANSFERT ENTRE APPAREILS ================= */
const b64e=s2=>btoa(unescape(encodeURIComponent(s2))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s2=>decodeURIComponent(escape(atob(s2.replace(/-/g,'+').replace(/_/g,'/'))));
function mkSync(){const url=location.href.split('#')[0]+'#sync='+b64e(JSON.stringify({v:1,likes,REF,HID,SUBS,BED}));$('#lk2').innerHTML=`<textarea id="sl" rows="3" readonly>${esc(url)}</textarea><div class="two"><button class="go alt" id="scp">Copier</button>${navigator.share?'<button class="go alt" id="ssh">Partager</button>':''}</div>`;
$('#scp').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Lien copié ✓')}catch(e){const t=$('#sl');t.focus();t.select()}};const sh=$('#ssh');if(sh)sh.onclick=()=>navigator.share({title:'Ciné ce soir : mes données',url}).catch(()=>{})}
function readSync(){const h=location.hash;if(!h.startsWith('#sync='))return false;const clear=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};let d;try{d=JSON.parse(b64d(h.slice(6)))}catch(e){clear();toast('Lien de transfert illisible');return false}
const n=Object.keys(d.likes||{}).length;openModal(`<div class="rv"><p class="q">Importer tes données ?</p><p class="sub">Ce lien contient ${n} film${n>1?'s':''} likés ou vus${d.SUBS&&d.SUBS.length?', et tes abonnements':''}. Ils seront fusionnés avec ceux de cet appareil.</p><button class="go" id="sy1">Importer</button><button class="go alt" id="sy0">Ignorer</button></div>`);
$('#sy1').onclick=()=>{for(const u in d.likes||{}){const a=likes[u],b=d.likes[u];if(!a||(b.st==='seen'&&a.st!=='seen')||((b.wd||b.ts)>(a.wd||a.ts)&&!(a.st==='seen'&&b.st!=='seen')))likes[u]=b}saveLikes();for(const u in d.REF||{})REF[u]=Math.max(REF[u]||0,d.REF[u]);Object.assign(HID,d.HID||{});saveRef();if(d.SUBS&&d.SUBS.length&&!SUBS.length){SUBS=d.SUBS;ls.set('subs',SUBS);plat=new Set(SUBS)}if(d.BED){BED=d.BED;ls.set('bed',BED)}clear();closeModal();render();toast('Données importées ✓')};
$('#sy0').onclick=()=>{clear();closeModal()};return true}
